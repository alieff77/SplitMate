name: splitmate
description: "Group bill splitting app with AI chat and QR payments."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1

  # State management (MVC)
  get: ^4.7.2

  # Networking (Anthropic AI API)
  http: ^1.3.0

  # Local storage
  shared_preferences: ^2.5.3

  # Image handling
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Environment variables
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
